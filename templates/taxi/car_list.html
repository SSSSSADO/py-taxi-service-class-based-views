{% extends "base.html" %}

{% block content %}
  <h1>Cars</h1>
  {% if car_list %}
    <table border="1">
      <tr>
        <th>Model</th>
        <th>Manufacturer</th>
      </tr>
      {% for car in car_list %}
        <tr>
          <td>
            <a href="{% url 'taxi:car-detail' car.id %}">
              {{ car.model }}
            </a>
          </td>
          <td>{{ car.manufacturer.name }}</td>
        </tr>
      {% endfor %}
    </table>
  {% endif %}
{% endblock %}
